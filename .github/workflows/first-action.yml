name: Python on Self-Hosted Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-python:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Show runner machine info
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Current folder:"
          pwd
          echo "Files:"
          ls -la

      - name: Check Python version
        run: python --version

      - name: Run Python file
        run: python main.py
