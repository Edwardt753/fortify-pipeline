name: Python Version Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Check Python version
        run: python --version

      - name: Run simple Python command
        run: python -c "print('Hello from Python inside GitHub Actions!')"
